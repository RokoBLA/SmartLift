<!doctype html>
<html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skice mišića</title><link rel="stylesheet" href="../css/styles.css">
<style>body{padding:12px}.r{display:flex;gap:6px;margin-bottom:10px;align-items:center}.r b{width:70px;font-size:12px}</style></head>
<body><div id="g"></div>
<script type="module">
  import { bodyMap, recoveryColor } from '../js/bodymap.js';
  import { MUSCLE_ORDER } from '../js/exercises.js';
  const pcts = [0, 25, 50, 75, 100];
  document.getElementById('g').innerHTML = MUSCLE_ORDER.map((m) => `<div class="r"><b>${m}</b>${pcts.map((p) => bodyMap(m, recoveryColor(p), m)).join('')}</div>`).join('');
</script></body></html>
